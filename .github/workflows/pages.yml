name: Test, build, and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run fixture:epub
      - name: Validate synthetic EPUB with EPUBCheck 5.4.0
        run: |
          curl -fsSL https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o /tmp/epubcheck.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          java -jar /tmp/epubcheck/epubcheck-5.4.0/epubcheck.jar .tmp/fixture.epub
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  verify:
    name: Verify public Pages
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check public URL
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$PAGES_URL" -o /tmp/aksara-pages.html
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify conversion, EPUB download and reader on Pages
        env:
          TEST_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:e2e -- --grep "real PDF upload|conversion retains images"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-browser-verification
          path: test-results/
          if-no-files-found: ignore
